<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TACNET - Law Enforcement Task Force Platform</title>

  <!-- Leaflet Map Engine -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  <style>
    :root {
      --dark-blue: #07111E;
      --navy-blue: #0F223D;
      --gold: #FFD700;
      --gold-border: #B8860B;
      --cmd-blue: #0052CC;
      --cmd-blue-glow: #0088FF;
      --light-blue: #00F0FF;
      --panic-green: #28a745;
      --panic-yellow: #ffc107;
      --panic-red: #dc3545;
    }

    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      background-color: var(--dark-blue); color: #FFF;
      overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* LANDING SCREEN */
    #landing-screen {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 10000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle, var(--navy-blue) 0%, var(--dark-blue) 100%);
      border: 10px solid var(--gold-border); padding: 20px; text-align: center;
    }

    .btn-enter {
      background: linear-gradient(135deg, var(--gold) 0%, #B8860B 100%);
      color: #000; font-size: 2.2rem; font-weight: 900; padding: 18px 60px;
      border: 3px solid #FFF; border-radius: 50px; cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.7); margin-top: 25px;
    }

    /* MAIN APP WORKSPACE */
    #main-app { display: none; width: 100vw; height: 100vh; flex-direction: column; }

    /* MAJOR's FULL-WIDTH BLUE COMMAND BANNER */
    #major-command-banner {
      width: 100%; height: 50px; background-color: var(--cmd-blue);
      color: #FFFFFF; font-size: 1.25rem; font-weight: 900;
      letter-spacing: 1.5px; text-align: center; line-height: 50px;
      border-bottom: 3px solid var(--gold);
      box-shadow: 0 4px 15px rgba(0, 136, 255, 0.5);
      z-index: 5000; flex-shrink: 0; text-transform: uppercase;
      text-shadow: 1px 1px 3px #000;
    }

    /* SECONDARY CONTROL BAR */
    .control-bar {
      height: 50px; background-color: var(--navy-blue);
      border-bottom: 2px solid var(--gold-border); padding: 0 15px;
      display: flex; align-items: center; gap: 10px; z-index: 4000; flex-shrink: 0;
    }

    .btn-action {
      background: var(--dark-blue); color: var(--gold); border: 2px solid var(--gold);
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem;
    }

    /* SLIDE-OUT DRAWER FOR 73 DISPATCHABLE UNITS */
    #units-drawer {
      position: absolute; top: 100px; left: -320px; width: 300px; height: calc(100vh - 160px);
      background: rgba(15, 34, 61, 0.95); border: 2px solid var(--gold);
      border-left: none; border-radius: 0 12px 12px 0; z-index: 4500;
      transition: left 0.3s ease-in-out; display: flex; flex-direction: column;
      box-shadow: 5px 0 20px rgba(0,0,0,0.8); backdrop-filter: blur(5px);
    }

    #units-drawer.open { left: 0; }

    .drawer-toggle-btn {
      position: absolute; right: -42px; top: 15px; width: 42px; height: 90px;
      background: var(--navy-blue); border: 2px solid var(--gold); border-left: none;
      border-radius: 0 8px 8px 0; color: var(--gold); font-weight: bold;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      writing-mode: vertical-rl; text-orientation: mixed; font-size: 0.85rem; letter-spacing: 2px;
    }

    .drawer-header {
      padding: 12px; background: var(--dark-blue); border-bottom: 1px solid var(--gold);
      font-weight: bold; color: var(--gold); text-align: center; font-size: 0.95rem;
    }

    .units-grid {
      flex: 1; overflow-y: auto; padding: 10px; display: grid;
      grid-template-columns: repeat(3, 1 circular); gap: 8px; align-content: start;
    }

    /* LARGER BLUE UNIT BADGES */
    .unit-badge {
      background: linear-gradient(145deg, #0052CC, #002D72); color: #FFF;
      border: 2px solid var(--gold); border-radius: 8px; padding: 8px 4px;
      text-align: center; font-weight: bold; font-size: 0.85rem; cursor: grab;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5); user-select: none;
    }

    /* MAP CONTAINER */
    #map-container { flex: 1; width: 100%; height: 100%; position: relative; }
    #map { width: 100%; height: 100%; }

    /* TEACHER / PANIC ALERT BAR AT BOTTOM */
    #panic-bar {
      height: 60px; background-color: var(--navy-blue); border-top: 2px solid var(--gold);
      display: flex; align-items: center; justify-content: space-around; padding: 0 10px;
      z-index: 4000; flex-shrink: 0;
    }

    .btn-panic {
      flex: 1; max-width: 30%; height: 44px; border: 2px solid #FFF; border-radius: 8px;
      font-weight: 900; font-size: 0.95rem; cursor: pointer; text-shadow: 1px 1px 2px #000;
    }
    .btn-green { background-color: var(--panic-green); color: #FFF; }
    .btn-yellow { background-color: var(--panic-yellow); color: #000; text-shadow: none; }
    .btn-red { background-color: var(--panic-red); color: #FFF; animation: pulse-btn 1s infinite; }

    @keyframes pulse-btn {
      0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
    }

    /* BLINKING GPS COMMAND MARKER */
    @keyframes gps-flash {
      0% { r: 10; fill-opacity: 1; stroke-width: 3; }
      50% { r: 22; fill-opacity: 0.3; stroke-width: 6; }
      100% { r: 10; fill-opacity: 1; stroke-width: 3; }
    }
    .blinking-gps-dot { animation: gps-flash 0.9s infinite ease-in-out; transform-origin: center; }
  </style>
</head>
<body>

  <!-- LANDING SCREEN -->
  <div id="landing-screen">
    <h1 style="color:var(--gold); font-size:3.2rem; text-shadow: 2px 2px #000; margin-bottom:5px;">TACNET</h1>
    <div style="color:var(--light-blue); font-size:1.3rem; font-weight:bold;">LAW ENFORCEMENT TASK FORCE PLATFORM</div>
    <div style="color:var(--gold); margin-top:20px; font-size:1rem;">APP CREATOR: EARL WOOD, DEPUTY SHERIFF (RET.), VIRGINIA</div>
    <button class="btn-enter" onclick="launchTacnet()">ENTER MAP</button>
  </div>

  <!-- MAIN WORKSPACE -->
  <div id="main-app">
    <!-- MAJOR'S TOP COMMAND BANNER -->
    <div id="major-command-banner">
      MAJOR NOW ONLINE CONTROLLING THE OPERATION
    </div>

    <!-- CONTROL BAR -->
    <div class="control-bar">
      <button class="btn-action" style="background:var(--gold); color:#000;" onclick="reCenterGPS()">🎯 RE-CENTER GPS</button>
      <button class="btn-action" onclick="setMapLayer('street')">Street</button>
      <button class="btn-action" onclick="setMapLayer('satellite')">Satellite</button>
      <button class="btn-action" style="margin-left:auto;" onclick="generateReport()">📄 GENERATE REPORT</button>
    </div>

    <!-- MAP CONTAINER -->
    <div id="map-container">
      <div id="map"></div>

      <!-- SLIDE-OUT DRAWER FOR 73 UNITS -->
      <div id="units-drawer">
        <div class="drawer-toggle-btn" onclick="toggleDrawer()">UNITS (73)</div>
        <div class="drawer-header">COMMAND UNITS RPOSTING</div>
        <div style="padding: 6px; text-align:center; font-size:0.75rem; color:var(--light-blue);">
          Tap a unit to deploy it directly onto the map screen.
        </div>
        <div class="units-grid" id="units-grid">
          <!-- 73 Unit Badges generated dynamically -->
        </div>
      </div>
    </div>

    <!-- SCHOOL SAFETY SILENT PANIC BAR -->
    <div id="panic-bar">
      <button class="btn-panic btn-green" onclick="sendPanicAlert('GREEN', 'Classroom Barricaded & Secure')">🟢 GREEN: SECURE</button>
      <button class="btn-panic btn-yellow" onclick="sendPanicAlert('YELLOW', 'Medical / Assist Needed')">🟡 YELLOW: ASSIST</button>
      <button class="btn-panic btn-red" onclick="sendPanicAlert('RED', 'ACTIVE THREAT AT DOOR')">🔴 RED: THREAT</button>
    </div>
  </div>

  <script>
    let map;
    let baseLayers = {};
    let liveGpsMarker = null;
    let currentLatLng = [37.5857, -79.0514]; // Amherst County ACSO default
    let deployedMarkers = {};

    // Device Identification Engine (Prevents Duplicate Indoor Dots)
    const deviceId = localStorage.getItem('tacnet_device_id') || 'UNIT-' + Math.floor(1000 + Math.random() * 9000);
    localStorage.setItem('tacnet_device_id', deviceId);

    function launchTacnet() {
      document.getElementById('landing-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'flex';

      setTimeout(() => {
        initMap();
        buildUnitsDrawer();
        activateRealtimeGPS();
      }, 150);
    }

    function initMap() {
      map = L.map('map', { zoomControl: true }).setView(currentLatLng, 15);

      baseLayers.street = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
      baseLayers.satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 });

      baseLayers.street.addTo(map);
      map.invalidateSize();

      drawLiveGPSDot(currentLatLng);
    }

    function setMapLayer(type) {
      if (map.hasLayer(baseLayers.street)) map.removeLayer(baseLayers.street);
      if (map.hasLayer(baseLayers.satellite)) map.removeLayer(baseLayers.satellite);
      baseLayers[type].addTo(map);
    }

    function toggleDrawer() {
      document.getElementById('units-drawer').classList.toggle('open');
    }

    /* POPULATE DRAWER WITH ALL 73 BLUE UNIT BADGES */
    function buildUnitsDrawer() {
      const grid = document.getElementById('units-grid');
      grid.innerHTML = '';
      for (let i = 1; i <= 73; i++) {
        const unitNum = i < 10 ? '0' + i : '' + i;
        const badge = document.createElement('div');
        badge.className = 'unit-badge';
        badge.innerText = 'UNIT ' + unitNum;
        badge.onclick = () => deployUnitToMap(unitNum);
        grid.appendChild(badge);
      }
    }

    /* DEPLOY DRAGGABLE UNIT MARKER TO MAP WITH REMOVE BUTTON */
    function deployUnitToMap(unitNum) {
      if (deployedMarkers[unitNum]) {
        alert('Unit ' + unitNum + ' is already on the map!');
        return;
      }

      // Slightly offset marker near current view center
      const center = map.getCenter();
      const lat = center.lat + (Math.random() - 0.5) * 0.003;
      const lng = center.lng + (Math.random() - 0.5) * 0.003;

      const unitIcon = L.divIcon({
        className: 'custom-unit-icon',
        html: `<div style="background:#0052CC; color:#FFF; border:2px solid #FFD700; border-radius:6px; padding:4px 6px; font-weight:bold; font-size:11px; text-align:center; box-shadow:0 2px 6px #000;">UNIT ${unitNum}</div>`,
        iconSize: [60, 26]
      });

      const marker = L.marker([lat, lng], { draggable: true, icon: unitIcon }).addTo(map);

      const popupContent = document.createElement('div');
      popupContent.style.color = '#000';
      popupContent.innerHTML = `<b>UNIT ${unitNum}</b><br><small>Status: Active Field Deployment</small><br><br>`;

      const removeBtn = document.createElement('button');
      removeBtn.innerText = '❌ REMOVE UNIT';
      removeBtn.style.cssText = 'background:#dc3545; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-weight:bold; cursor:pointer; width:100%;';
      removeBtn.onclick = () => {
        map.removeLayer(marker);
        delete deployedMarkers[unitNum];
      };

      popupContent.appendChild(removeBtn);
      marker.bindPopup(popupContent);

      deployedMarkers[unitNum] = marker;
      toggleDrawer(); // close drawer
    }

    /* DRAW / UPDATE LIVE GPS COMMAND MARKER */
    function drawLiveGPSDot(latLng) {
      if (!liveGpsMarker) {
        liveGpsMarker = L.circleMarker(latLng, {
          radius: 12, color: '#FFD700', weight: 3, fillColor: '#FF0033', fillOpacity: 1.0, className: 'blinking-gps-dot'
        }).addTo(map);

        liveGpsMarker.bindPopup(`<b>COMMAND OFFICER LIVE POSITION</b><br>ID: ${deviceId}`).openPopup();
      } else {
        liveGpsMarker.setLatLng(latLng);
      }
    }

    function activateRealtimeGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition((pos) => {
          currentLatLng = [pos.coords.latitude, pos.coords.longitude];
          drawLiveGPSDot(currentLatLng);
        }, (err) => console.log('GPS Lock Active'), { enableHighAccuracy: true });
      }
    }

    function reCenterGPS() {
      if (map) { map.setView(currentLatLng, 16); map.invalidateSize(); }
    }

    function sendPanicAlert(color, message) {
      const alertMarker = L.circleMarker(map.getCenter(), {
        radius: 16,
        color: '#FFF',
        weight: 3,
        fillColor: color === 'GREEN' ? '#28a745' : (color === 'YELLOW' ? '#ffc107' : '#dc3545'),
        fillOpacity: 0.95
      }).addTo(map);

      alertMarker.bindPopup(`<b>SILENT ALARM: ${color}</b><br>${message}<br><small>Time: ${new Date().toLocaleTimeString()}</small>`).openPopup();
      alert("SILENT ALERT TRANSMITTED TO COMMAND CENTER: " + message);
    }

    function generateReport() {
      const activeCount = Object.keys(deployedMarkers).length;
      alert(`=== TACNET OFFICIAL INCIDENT LOG ===\nDate: ${new Date().toLocaleDateString()}\nTime: ${new Date().toLocaleTimeString()}\nCommand Status: MAJOR ONLINE\nUnits Field Deployed: ${activeCount}\nGPS Coordinates: ${currentLatLng[0].toFixed(5)}, ${currentLatLng[1].toFixed(5)}\n\nReport Generated Successfully.`);
    }
  </script>
</body>
</html>
